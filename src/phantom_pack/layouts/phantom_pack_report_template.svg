                    style="white-space: pre" xml:space="preserve"><tspan id="images_header_right_label" font-style="italic">{{images_header_right}}</tspan><tspan id="images_header_right_spacing"> </tspan><tspan id="images_header_right_value">{{ihr_val}}</tspan></text>
            </g>
            <image id="img_0" x="51" y="470" width="256" height="512" preserveAspectRatio="none" href="" />
