<?xml version='1.0' encoding='UTF-8'?>
<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="1024"
    height="1024" viewBox="0 0 1024 1024" fill="none">
    <g id="phantom_pack_report_template">
        <rect width="1024" height="1024" fill="#0B0303" />
        <g id="images">
            <g id="images_header_left">
                <text id="images_header_left_text" x="54" y="430.434" text-anchor="start"
