                    style="white-space: pre" xml:space="preserve"><tspan id="images_header_left_label" font-style="italic">{{images_header_left}}</tspan><tspan id="images_header_left_spacing"> </tspan><tspan id="images_header_left_value">{{ihl_val}}</tspan></text>
            </g>
            <g id="images_header_right">
                <text id="images_header_right_text" x="974" y="430.434" text-anchor="end"
